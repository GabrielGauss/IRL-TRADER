# Append to the shared nginx config (e.g. /opt/macropulse/nginx/nginx.conf).
# Replace bot.example.com with your subdomain. Only POST /signals is public;
# /health and /metrics stay internal (use `docker exec trading-bot trading-bot status`).

limit_req_zone $binary_remote_addr zone=bot_signals:10m rate=5r/s;

server {
    listen 80;
    server_name bot.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name bot.example.com;

    # VERIFY this cert path exists (ls /etc/letsencrypt/live/) before reload.
    ssl_certificate     /etc/letsencrypt/live/bot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff always;

    client_max_body_size 16k;

    location = /signals {
        limit_except POST { deny all; }
        limit_req zone=bot_signals burst=10 nodelay;
        limit_req_status 429;

        # Optional: allow only TradingView's webhook IPs (check TradingView's
        # docs for the current list), then uncomment `deny all`.
        # allow <tradingview-ip>;
        # deny all;

        # Docker DNS: resolve at request time so nginx still starts if the
        # bot container is down.
        resolver 127.0.0.11 valid=30s;
        set $bot_upstream http://trading-bot:8080;
        proxy_pass         $bot_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / { return 404; }
}
