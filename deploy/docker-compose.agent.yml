# The volatility-target agent: trades BTC through irl-gateway (MCP) and IRL.
# Runs next to the signal bot with its own image, data volume, IRL agent and
# IRL token. Paper by default (the gateway's PaperBroker at live prices).
#
#   docker compose -f deploy/docker-compose.agent.yml up -d --build
#
# ../.env.agent needs: IRL_BASE_URL, IRL_API_TOKEN, IRL_AGENT_ID,
# IRL_MODEL_HASH, IRL_L2_MODE (regime when IRL has Layer 2 on). Optional:
# PAPER_BALANCES (seed for a new paper account), AGENT_MODEL_ID.
name: trading-agent

services:
  trading-agent:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        EXTRAS: agent
    image: trading-bot-agent:latest
    container_name: trading-agent
    restart: unless-stopped
    env_file: ../.env.agent
    environment:
      IRL_GATEWAY_HOME: /data/gateway
      IRL_GATEWAY_COMMAND: irl-gateway
      LOG_LEVEL: INFO
    command: ["agent", "--loop"]
    healthcheck:
      disable: true
    volumes:
      - trading_agent_data:/data
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy

volumes:
  trading_agent_data:

networks:
  proxy:
    name: ${PROXY_NETWORK:-macropulse_default}
    external: true
